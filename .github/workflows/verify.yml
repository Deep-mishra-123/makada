name: Verify portable robot setup
on: [push, pull_request]
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/setup_robot.py init
      - run: python -m platformio run -d hexapod
      - run: python tools/onboard_walk.py --help
      - run: python tools/hexapod.py --help
